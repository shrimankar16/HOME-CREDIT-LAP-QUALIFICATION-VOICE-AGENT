<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Phone Call - Home Credit LAP Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .helper-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #667eea;
            color: white;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        
        .status.info {
            background: #dbeafe;
            color: #1e40af;
            display: block;
        }
        
        .phone-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .call-details {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }
        
        .call-details.show {
            display: block;
        }
        
        .call-details p {
            margin: 5px 0;
            color: #666;
        }
        
        .call-details strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-icon">📞</div>
        
        <div class="header">
            <h1>Make Phone Call</h1>
            <p>AI Agent will call the customer</p>
        </div>
        
        <form id="callForm">
            <div class="form-group">
                <label for="phoneNumber">Customer Phone Number *</label>
                <input 
                    type="tel" 
                    id="phoneNumber" 
                    placeholder="+919876543210" 
                    required
                    pattern="^\+?[1-9]\d{1,14}$"
                >
                <div class="helper-text">Include country code (e.g., +91 for India)</div>
            </div>
            
            <div class="form-group">
                <label for="customerName">Customer Name *</label>
                <input 
                    type="text" 
                    id="customerName" 
                    placeholder="Rajesh Kumar" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="language">Language</label>
                <select id="language">
                    <option value="english">English</option>
                    <option value="hindi">Hindi</option>
                </select>
            </div>
            
            <button type="submit" class="btn" id="callBtn">
                📞 Make Call
            </button>
        </form>
        
        <div id="status" class="status"></div>
        
        <div id="callDetails" class="call-details">
            <p><strong>Call SID:</strong> <span id="callSid"></span></p>
            <p><strong>Status:</strong> <span id="callStatus"></span></p>
            <p><strong>Phone:</strong> <span id="calledNumber"></span></p>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin + '/api';
        
        document.getElementById('callForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phoneNumber = document.getElementById('phoneNumber').value;
            const customerName = document.getElementById('customerName').value;
            const language = document.getElementById('language').value;
            
            const statusDiv = document.getElementById('status');
            const callBtn = document.getElementById('callBtn');
            const callDetails = document.getElementById('callDetails');
            
            // Show loading
            callBtn.disabled = true;
            callBtn.textContent = '📞 Initiating Call...';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Connecting to telephony service...';
            callDetails.classList.remove('show');
            
            try {
                const response = await fetch(`${API_BASE}/voice/make-call`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber,
                        customerName,
                        language
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = `
                        ✅ Call initiated successfully!<br>
                        The customer will receive a call in a few seconds.
                    `;
                    
                    // Show call details
                    document.getElementById('callSid').textContent = data.callSid;
                    document.getElementById('callStatus').textContent = 'Calling...';
                    document.getElementById('calledNumber').textContent = data.phoneNumber;
                    callDetails.classList.add('show');
                    
                    // Reset form
                    setTimeout(() => {
                        if (confirm('Call initiated! Make another call?')) {
                            location.reload();
                        }
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Failed to initiate call');
                }
            } catch (error) {
                statusDiv.className = 'status error';
                
                if (error.message.includes('Twilio not configured')) {
                    statusDiv.innerHTML = `
                        ⚠️ <strong>Twilio Not Configured</strong><br>
                        Please set up Twilio credentials in .env file.<br>
                        See PHONE_CALL_SETUP.md for instructions.
                    `;
                } else {
                    statusDiv.textContent = '❌ Error: ' + error.message;
                }
            } finally {
                callBtn.disabled = false;
                callBtn.textContent = '📞 Make Call';
            }
        });
        
        // Check if Twilio is configured
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                // Could add check here if needed
            } catch (error) {
                console.error('Health check failed:', error);
            }
        });
    </script>
</body>
</html>
