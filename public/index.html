<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Credit LAP Voice Agent - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .setup {
            margin-bottom: 30px;
        }
        
        .setup label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .setup input, .setup select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .setup input:focus, .setup select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .conversation {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            display: none;
        }
        
        .conversation.active {
            display: block;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.agent {
            background: #667eea;
            color: white;
            margin-right: auto;
        }
        
        .message.customer {
            background: #e5e7eb;
            color: #333;
            margin-left: auto;
        }
        
        .message .speaker {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.8;
        }
        
        .message .text {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .input-area {
            display: none;
        }
        
        .input-area.active {
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .input-area button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .input-area button:hover {
            background: #5568d3;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status.warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .progress {
            margin-top: 15px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }
        
        .progress strong {
            color: #333;
        }
        
        .mic-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ef4444;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin: 0 auto;
            display: none;
            transition: all 0.3s;
        }
        
        .mic-button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }
        
        .mic-button.active {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Home Credit LAP Voice Agent</h1>
            <p>Test the voice qualification system</p>
        </div>
        
        <div id="setupSection" class="setup">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter customer name" value="Amit Sharma">
            
            <label for="language">Language</label>
            <select id="language">
                <option value="english">English</option>
                <option value="hindi">Hindi</option>
            </select>
            
            <label for="agentGender">Agent Gender</label>
            <select id="agentGender">
                <option value="female">Female (Priya)</option>
                <option value="male">Male</option>
            </select>
            
            <button class="btn btn-primary" onclick="startCall()">📞 Start Call</button>
        </div>
        
        <div id="statusSection"></div>
        
        <div id="conversation" class="conversation"></div>
        
        <div id="inputArea" class="input-area">
            <input type="text" id="messageInput" placeholder="Type your response..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
        
        <button id="endCallBtn" class="btn btn-danger" style="display: none;" onclick="endCall()">End Call</button>
        
        <div id="progress" class="progress" style="display: none;">
            <strong>Progress:</strong> <span id="progressText">0/7 questions answered</span>
        </div>
    </div>
    
    <script>
        let sessionId = null;
        let conversationHistory = [];
        const API_BASE = 'http://localhost:3000/api';
        
        async function startCall() {
            const customerName = document.getElementById('customerName').value.trim();
            const language = document.getElementById('language').value;
            const agentGender = document.getElementById('agentGender').value;
            
            if (!customerName) {
                showStatus('Please enter customer name', 'error');
                return;
            }
            
            try {
                showStatus('Starting call...', 'warning');
                
                const response = await fetch(`${API_BASE}/sessions/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerName, language, agentGender })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to start call');
                }
                
                sessionId = data.sessionId;
                conversationHistory = [];
                
                // Show conversation UI
                document.getElementById('setupSection').style.display = 'none';
                document.getElementById('conversation').classList.add('active');
                document.getElementById('inputArea').classList.add('active');
                document.getElementById('endCallBtn').style.display = 'block';
                document.getElementById('progress').style.display = 'block';
                
                // Add agent's greeting
                addMessage('agent', data.response);
                
                showStatus('Call connected', 'success');
                
                // Focus on input
                document.getElementById('messageInput').focus();
                
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                console.error('Start call error:', error);
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !sessionId) return;
            
            // Add customer message
            addMessage('customer', message);
            input.value = '';
            
            try {
                const response = await fetch(`${API_BASE}/sessions/${sessionId}/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send message');
                }
                
                // Add agent response
                addMessage('agent', data.response);
                
                // Update progress
                if (data.state && data.state.checklistProgress) {
                    const { completed, total } = data.state.checklistProgress;
                    document.getElementById('progressText').textContent = 
                        `${completed}/${total} questions answered`;
                }
                
                // Check if call should end
                if (data.shouldEndCall) {
                    showStatus(`Call ended: ${data.state.callOutcome}`, 'warning');
                    document.getElementById('inputArea').style.display = 'none';
                    setTimeout(() => {
                        if (confirm('Call completed. Start a new call?')) {
                            location.reload();
                        }
                    }, 2000);
                }
                
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                console.error('Send message error:', error);
            }
        }
        
        function addMessage(speaker, text) {
            const conversation = document.getElementById('conversation');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${speaker}`;
            messageDiv.innerHTML = `
                <div class="speaker">${speaker === 'agent' ? '🤖 Agent' : '👤 Customer'}</div>
                <div class="text">${text}</div>
            `;
            conversation.appendChild(messageDiv);
            conversation.scrollTop = conversation.scrollHeight;
            
            conversationHistory.push({ speaker, text });
        }
        
        function showStatus(message, type) {
            const statusSection = document.getElementById('statusSection');
            statusSection.innerHTML = `<div class="status ${type}">${message}</div>`;
            
            if (type !== 'error') {
                setTimeout(() => {
                    statusSection.innerHTML = '';
                }, 3000);
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        async function endCall() {
            if (!sessionId) return;
            
            try {
                await fetch(`${API_BASE}/sessions/${sessionId}`, {
                    method: 'DELETE'
                });
                
                showStatus('Call ended', 'warning');
                
                setTimeout(() => {
                    if (confirm('Call ended. Start a new call?')) {
                        location.reload();
                    }
                }, 1000);
                
            } catch (error) {
                console.error('End call error:', error);
            }
        }
        
        // Check if API is running
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (!response.ok) {
                    showStatus('⚠️ API server not running. Please start it with: npm start', 'error');
                }
            } catch (error) {
                showStatus('⚠️ Cannot connect to API server. Make sure it\'s running on http://localhost:3000', 'error');
            }
        });
    </script>
</body>
</html>
